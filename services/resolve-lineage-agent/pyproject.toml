[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resolve-lineage-agent"
version = "0.1.0"
description = "A DataHub-native agent that validates evidence against metadata context and writes resolution state back to the graph."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Symmetry Solutions" }]
dependencies = ["acryl-datahub>=1.1.0,<2.0.0"]

[project.scripts]
resolve-lineage-agent = "resolve_lineage_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

